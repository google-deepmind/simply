<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
	<!-- amplio mark: the amply chevron rotated 90° CCW reads as an "A" apex.
	     Mint/teal disc inherited from upstream amply (#56B6C6) for visual
	     continuity; the rotation is amplio's own differentiation. -->
	<circle cx="12" cy="12" r="12" fill="#56B6C6" />
	<g
		fill="none"
		stroke="#ffffff"
		stroke-width="5"
		stroke-linecap="round"
		stroke-linejoin="round"
		transform="translate(0 -0.6) rotate(-90 12 12) translate(4.2 3.6) scale(0.7)"
	>
		<path d="m9 18 6-6-6-6" />
	</g>
</svg>
