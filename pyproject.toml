[project]
name = "simply"
version = "0.3.9"
description = "Simply: Minimal Code for Frontier LLM Research in JAX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "absl-py>=2.3.1",
    "datasets",
    "deprecated",
    "einops>=0.8.1",
    "grain>=0.2.15",
    "orbax>=0.1.9",
    "sentencepiece",
    "setuptools<81",
    "tensorboard>=2.20.0",
    "tensorboardX",
    "jax>=0.10",
    "tokenizers",
    "wandb>=0.25.0",
]


[project.optional-dependencies]
gpu = [
    "jax[cuda13]; sys_platform == 'linux'",
]
tpu = [
    "jax[tpu]>=0.10; sys_platform == 'linux'",
]
tfds = [
    "tensorflow-cpu; sys_platform != 'darwin'",
    "tensorflow; sys_platform == 'darwin'",
    "tensorflow-datasets>=4.9.9",
]
gcloud = [
    "gcsfs",
]
math-eval = [
    "sympy",
    "pylatexenc",
]
serving = [
    "grpcio",
    "grpcio-health-checking",
    "grpcio-reflection",
    "grpcio-tools",
    "protobuf>=6.33",
]
agent = [
    "litellm",
    "pydantic>=2.0",
    "python-frontmatter",
    "rich",
    "jinja2",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["simply", "simply.*"]
