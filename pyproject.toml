[project]
name = "simply"
version = "0.4.0"
description = "Simply: Minimal Code for Frontier LLM Research in JAX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "absl-py>=2.3.1",
    "datasets",
    "deprecated",
    "einops>=0.8.1",
    "grain>=0.2.15",
    "orbax>=0.1.9",
    "sentencepiece",
    "setuptools<84",
    "tensorboard>=2.20.0",
    "tensorboardX",
    "jax>=0.10",
    "tokenizers",
    "wandb>=0.25.0",
]


[project.optional-dependencies]
gpu = [
    "jax[cuda13]; sys_platform == 'linux'",
]
tpu = [
    "jax[tpu]>=0.10; sys_platform == 'linux'",
]
tfds = [
    "tensorflow-cpu; sys_platform != 'darwin'",
    "tensorflow; sys_platform == 'darwin'",
    "tensorflow-datasets>=4.9.9",
    # TFDS imports it lazily the first time it prepares a dataset.
    "importlib_resources",
]
gcloud = [
    "gcsfs",
]
assets = [
    # setup/setup_assets.py downloads models, datasets and vocabs.
    "huggingface_hub",
    # tasks/research_bench/setup/prepare_assets.py checksums a staged
    # cache with crc32c, the digest GCS keeps in object metadata.
    "google-crc32c",
]
math-eval = [
    "sympy",
    "pylatexenc",
]
serving = [
    "grpcio",
    "grpcio-health-checking",
    "grpcio-reflection",
    "grpcio-tools",
    "protobuf>=6.33",
]
agent = [
    "litellm",
    "pydantic>=2.0",
    "python-frontmatter",
    "rich",
    "jinja2",
]
zoo = [
    # simply/zoo/kimi_k3 tokenizes with the vendored tiktoken model.
    "tiktoken",
    # simply/zoo/qwen3p8 renders the released chat template.
    "jinja2",
]
dev = [
    "pytest",
    # `simply/tools/hf_to_orbax.py` parses safetensors itself; its test writes
    # the fixtures with the reference implementation.
    "safetensors",
]

[tool.pytest.ini_options]
# `simply/zoo/` has same-named test modules (e.g. several `mla_test.py`) in
# directories without `__init__.py`; importlib mode keeps them apart.
addopts = "--import-mode=importlib"

[tool.setuptools.packages.find]
include = ["simply", "simply.*"]

[tool.setuptools.package-data]
# Protos (the source for the generated gRPC stubs), golden fixtures, and the
# tokenizers the zoo vendors together with their upstream licences.
"*" = ["*.proto", "*.json", "*.jinja", "*.npz", "*.model", "*_LICENSE"]
